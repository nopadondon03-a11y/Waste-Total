<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Waste & Consumption Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-5">
    <div class="max-w-7xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-gray-800">Waste & Con Analysis Dashboard</h1>
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-indigo-500">
                <p class="text-xs text-gray-500 uppercase font-bold">CONSUMPTION (กก.)</p>
                <p id="total-con" class="font-bold text-3xl text-gray-800">0.00</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-pink-500">
                <p class="text-xs text-gray-500 uppercase font-bold">WEIGHT NCP (กก.)</p>
                <p id="total-waste" class="font-bold text-3xl text-gray-800">0.00</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-amber-500">
                <p class="text-xs text-gray-500 uppercase font-bold">% NCP</p>
                <p id="ncp-percent" class="font-bold text-3xl text-gray-800">0.00%</p>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="bg-white p-6 rounded-2xl shadow border grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
            <div class="col-span-2">
                <label class="text-xs font-bold text-gray-500 block mb-2">ช่วงวันที่</label>
                <div class="flex gap-2">
                    <input type="date" id="date-start" class="border p-2 rounded w-full" onchange="applyFilters()">
                    <input type="date" id="date-end" class="border p-2 rounded w-full" onchange="applyFilters()">
                </div>
            </div>
            <select id="filter-group" class="border p-2 rounded" onchange="applyFilters()"><option value="ALL">กลุ่ม (ทั้งหมด)</option></select>
            <select id="filter-issue" class="border p-2 rounded" onchange="applyFilters()"><option value="ALL">ปัญหา (ทั้งหมด)</option></select>
            <select id="filter-machine" class="border p-2 rounded" onchange="applyFilters()"><option value="ALL">เครื่องจักร (ทั้งหมด)</option></select>
        </div>

        <!-- Tables -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow border">
                <h2 class="font-bold mb-4">ข้อมูล Waste</h2>
                <div class="overflow-y-auto max-h-96">
                    <table class="w-full text-sm"><tbody id="table-waste"></tbody></table>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow border">
                <h2 class="font-bold mb-4">ข้อมูล Con</h2>
                <div class="overflow-y-auto max-h-96">
                    <table class="w-full text-sm"><tbody id="table-con"></tbody></table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sheetWasteUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=958121043&single=true&output=csv';
        const sheetConUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=1766634310&single=true&output=csv';
        
        let wasteData = [], conData = [];

        async function fetchAllData() {
            const [wRes, cRes] = await Promise.all([fetch(sheetWasteUrl).then(r=>r.text()), fetch(sheetConUrl).then(r=>r.text())]);
            
            // ปรับปรุงการอ่านข้อมูล Waste
            wasteData = wRes.split('\n').slice(1).map(row => {
                const c = row.split(',').map(x=>x.replace(/"/g,'').trim());
                return { group: c[0], issue: c[2], machine: c[3], weight: parseFloat(c[4])||0, date: c[5] };
            }).filter(r => r.group);

            // ปรับปรุงการอ่านข้อมูล Con: พยายามหาข้อมูลที่เป็นตัวเลขในทุกคอลัมน์
            conData = cRes.split('\n').slice(1).map(row => {
                const c = row.split(',').map(x=>x.replace(/"/g,'').trim());
                let total = 0;
                // บวกคอลัมน์น้ำหนัก 1, 7, 13, 19
                [1, 7, 13, 19].forEach(idx => { total += parseFloat(c[idx]) || 0; });
                return { date: c[25], val: total };
            }).filter(r => r.val > 0);

            applyFilters();
        }

        function applyFilters() {
            const fWaste = wasteData; // เพิ่ม Logic กรองที่นี่ได้ในอนาคต
            const fCon = conData;

            // Update Summary
            const totalWaste = fWaste.reduce((s,r) => s + r.weight, 0);
            const totalCon = fCon.reduce((s,r) => s + r.val, 0);
            
            document.getElementById('total-con').innerText = totalCon.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('total-waste').innerText = totalWaste.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('ncp-percent').innerText = totalCon > 0 ? ((totalWaste / totalCon) * 100).toFixed(2) + "%" : "0%";

            // Update Tables
            document.getElementById('table-waste').innerHTML = fWaste.map(r => `<tr><td class="py-1">${r.issue}</td><td class="text-right py-1">${r.weight.toFixed(2)}</td></tr>`).join('');
            document.getElementById('table-con').innerHTML = fCon.map(r => `<tr><td class="py-1">Consumption</td><td class="text-right py-1">${r.val.toFixed(2)}</td></tr>`).join('');
        }
        fetchAllData();
    </script>
</body>
</html>
