<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Analysis Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ใช้ URL ใหม่ที่คุณให้มา
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=958121043&single=true&output=csv';

        async function fetchSheetData() {
            try {
                const response = await fetch(sheetCSVUrl);
                const data = await response.text();
                console.log("ข้อมูลที่โหลดได้:", data);
                // เพิ่ม Logic การประมวลผลข้อมูลที่นี่
            } catch (e) {
                console.error("โหลดข้อมูลไม่สำเร็จ:", e);
            }
        }
        window.onload = fetchSheetData;
    </script>
</head>
<body class="bg-gray-100 p-5">
    <h1 class="text-2xl font-bold">Waste Dashboard กำลังโหลด...</h1>
</body>
</html>
