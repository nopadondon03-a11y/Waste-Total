<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Waste & Consumption Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-5">
    <div class="max-w-4xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-gray-800">Waste & Consumption Dashboard</h1>
        
        <div class="bg-white p-6 rounded-2xl shadow border flex flex-wrap gap-4 items-center">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">จากวันที่</label>
                <input type="date" id="date-start" class="border p-2 rounded" onchange="updateDashboard()">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">ถึงวันที่</label>
                <input type="date" id="date-end" class="border p-2 rounded" onchange="updateDashboard()">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">เลือกเครื่องจักร</label>
                <select id="machine-filter" class="border p-2 rounded w-40" onchange="updateDashboard()">
                    <option value="all">ทั้งหมด</option>
                </select>
            </div>
            <button onclick="resetFilters()" class="mt-4 bg-gray-200 px-4 py-2 rounded text-sm hover:bg-gray-300">ล้างค่า</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-pink-500">
                <p class="text-xs text-gray-500 uppercase font-bold">Total Waste Weight (กก.)</p>
                <p id="total-weight" class="font-bold text-4xl text-gray-800">0.00</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow border-l-8 border-blue-500">
                <p class="text-xs text-gray-500 uppercase font-bold">Total Consumption (กก.)</p>
                <p id="total-con" class="font-bold text-4xl text-gray-800">0.00</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow border">
            <h2 class="font-bold mb-4">รายละเอียด Waste</h2>
            <div class="max-h-96 overflow-y-auto">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 sticky top-0">
                        <tr><th class="py-2 text-left">ปัญหา</th><th class="py-2 text-right">น้ำหนัก (กก.)</th></tr>
                    </thead>
                    <tbody id="table-waste"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sheetWasteUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=0&single=true&output=csv';
        const sheetConUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=1510959089&single=true&output=csv';
        
        let wasteData = [], conData = [], machineHeaders = [];

        function parseCleanFloat(val) {
            return parseFloat(val?.toString().replace(/,/g, '')) || 0;
        }

        // ปรับปรุงการอ่านวันที่ให้ยืดหยุ่นขึ้นมาก
        function formatDate(dStr) {
            if (!dStr) return "";
            // ลองตัดช่องว่างและแปลงเป็น object วันที่
            const d = new Date(dStr);
            if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
            
            // ถ้าเป็นรูปแบบ dd/mm/yyyy
            const parts = dStr.trim().split(/[\/\-]/);
            if (parts.length === 3) {
                let day = parts[0], month = parts[1], year = parts[2];
                if (year.length === 2) year = "20" + year;
                return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
            }
            return "";
        }

        async function fetchAllData() {
            try {
                const [wRes, cRes] = await Promise.all([fetch(sheetWasteUrl).then(r=>r.text()), fetch(sheetConUrl).then(r=>r.text())]);
                const parseCSV = (row) => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/^"|"$/g, '').trim());
                
                // Waste
                const wLines = wRes.split('\n');
                machineHeaders = parseCSV(wLines[0]).slice(4, 14);
                const filter = document.getElementById('machine-filter');
                machineHeaders.forEach((m, i) => { if(m) filter.innerHTML += `<option value="${m}">${m}</option>`; });
                
                wasteData = wLines.slice(1).filter(r => r.trim()).map(row => {
                    const c = parseCSV(row);
                    const weights = {};
                    machineHeaders.forEach((m, i) => weights[m] = parseCleanFloat(c[4 + i]));
                    return { issue: c[3], weights, date: formatDate(c[0]) };
                });

                // Consumption: เพิ่ม Console Log เพื่อเช็คค่าดิบที่อ่านได้
                conData = cRes.split('\n').slice(1).filter(r => r.trim()).map((row) => {
                    const c = parseCSV(row);
                    const dateObj = formatDate(c[25]);
                    // ช่วยดูใน Console ว่า dateObj ได้ค่าเป็นอะไร
                    return { 
                        isowa: parseCleanFloat(c[1]),
                        bhs: parseCleanFloat(c[7]),
                        yueli: parseCleanFloat(c[13]),
                        date: dateObj,
                        rawDate: c[25] 
                    };
                });
                console.log("ตัวอย่างข้อมูล Consumption ที่อ่านได้:", conData.slice(0, 5));
                updateDashboard();
            } catch (e) { console.error("Error Fetching:", e); }
        }

        function updateDashboard() {
            const start = document.getElementById('date-start').value;
            const end = document.getElementById('date-end').value;
            const mFilter = document.getElementById('machine-filter').value;

            const fWaste = wasteData.filter(r => (!start || r.date >= start) && (!end || r.date <= end));
            const fCon = conData.filter(r => (!start || r.date >= start) && (!end || r.date <= end));
            
            let totW = 0;
            document.getElementById('table-waste').innerHTML = fWaste.map(r => {
                const w = mFilter === "all" ? Object.values(r.weights).reduce((a, b) => a + b, 0) : (r.weights[mFilter] || 0);
                totW += w;
                return w > 0 ? `<tr><td class="py-2 border-b">${r.issue}</td><td class="text-right py-2 border-b">${w.toLocaleString(undefined, {minimumFractionDigits: 2})}</td></tr>` : "";
            }).join('');
            document.getElementById('total-weight').innerText = totW.toLocaleString(undefined, {minimumFractionDigits: 2});

            let totC = 0;
            fCon.forEach(r => {
                if (mFilter === "all") totC += (r.isowa + r.bhs + r.yueli);
                else if (mFilter.toUpperCase().includes("ISOWA")) totC += r.isowa;
                else if (mFilter.toUpperCase().includes("BHS")) totC += r.bhs;
                else if (mFilter.toUpperCase().includes("YUELI")) totC += r.yueli;
            });
            document.getElementById('total-con').innerText = totC.toLocaleString(undefined, {minimumFractionDigits: 2});
        }
        
        function resetFilters() {
            document.getElementById('date-start').value = '';
            document.getElementById('date-end').value = '';
            document.getElementById('machine-filter').value = 'all';
            updateDashboard();
        }
        fetchAllData();
    </script>
</body>
</html>
