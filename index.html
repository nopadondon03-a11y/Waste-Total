<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Waste & Consumption Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-5">
    <div class="max-w-7xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-gray-800">Waste & Con Analysis Dashboard</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-indigo-100 border-l-8 border-l-indigo-500">
                <p class="text-xs text-gray-500 uppercase font-bold">CONSUMPTION (กก.)</p>
                <p id="total-con" class="font-bold text-3xl text-gray-800">0.00</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-pink-100 border-l-8 border-pink-500">
                <p class="text-xs text-gray-500 uppercase font-bold">WEIGHT NCP (กก.)</p>
                <p id="total-waste" class="font-bold text-3xl text-gray-800">0.00</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-100 border-l-8 border-amber-500">
                <p class="text-xs text-gray-500 uppercase font-bold">% NCP</p>
                <p id="ncp-percent" class="font-bold text-3xl text-gray-800">0.00%</p>
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-2">ช่วงวันที่</label>
                <div class="flex gap-2">
                    <input type="date" id="date-start" class="border p-2 rounded w-full" onchange="applyFilters()">
                    <input type="date" id="date-end" class="border p-2 rounded w-full" onchange="applyFilters()">
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-2">กลุ่ม (Col A)</label>
                <select id="filter-group" class="border p-2 rounded w-full" onchange="applyFilters()"><option value="ALL">ทั้งหมด</option></select>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-2">ปัญหา (Col C)</label>
                <select id="filter-issue" class="border p-2 rounded w-full" onchange="applyFilters()"><option value="ALL">ทั้งหมด</option></select>
            </div>
            <div>
                <label class="text-xs font-bold text-gray-500 block mb-2">เครื่องจักร (Col D)</label>
                <select id="filter-machine" class="border p-2 rounded w-full" onchange="applyFilters()"><option value="ALL">ทั้งหมด</option></select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border"><h2 class="font-bold mb-4">ข้อมูล Waste</h2><table class="w-full text-sm"><tbody id="table-waste"></tbody></table></div>
            <div class="bg-white p-6 rounded-xl shadow-sm border"><h2 class="font-bold mb-4">ข้อมูล Con</h2><table class="w-full text-sm"><tbody id="table-con"></tbody></table></div>
        </div>
    </div>

    <script>
        const sheetWasteUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=958121043&single=true&output=csv';
        const sheetConUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ4-ipAaFTNUcPGr2SyPJD4uxrnVZhYBuvrSl__M7x_qe24hKv4WCxnmL_EpttrvIi30AuJmLpwmOMp/pub?gid=1766634310&single=true&output=csv';
        
        let wasteData = [], conData = [];

        function parseDate(d) {
            const parts = d.trim().split(/[\/\-]/);
            if (parts.length < 3) return null;
            let [d1, m1, y1] = parts;
            if (y1.length === 2) y1 = '20' + y1;
            return new Date(`${y1}-${m1.padStart(2, '0')}-${d1.padStart(2, '0')}`);
        }

        async function fetchAllData() {
            const [wRes, cRes] = await Promise.all([fetch(sheetWasteUrl).then(r=>r.text()), fetch(sheetConUrl).then(r=>r.text())]);
            
            wasteData = wRes.split('\n').slice(1).map(row => {
                const c = row.split(',').map(x=>x.replace(/"/g,'').trim());
                return { group: c[0], issue: c[2], machine: c[3], weight: parseFloat(c[4])||0, date: parseDate(c[5]) };
            }).filter(r=>r.date);

            // เติม Dropdown
            ['group', 'issue', 'machine'].forEach(key => {
                const select = document.getElementById('filter-' + key);
                const unique = [...new Set(wasteData.map(r => r[key]))].sort();
                unique.forEach(val => select.innerHTML += `<option value="${val}">${val}</option>`);
            });
            
            cRes.split('\n').slice(1).forEach(row => {
                const c = row.split(',').map(x=>x.replace(/"/g,'').trim());
                const date = parseDate(c[25]);
                if(!date) return;
                [{n:'ISOWA',v:c[1]},{n:'BHS',v:c[7]},{n:'YUELI',v:c[13]},{n:'ALL',v:c[19]}].forEach(m=>{
                    if(parseFloat(m.v)>0) conData.push({machine:m.n, weight:parseFloat(m.v), date:date});
                });
            });
            applyFilters();
        }

        function applyFilters() {
            const start = new Date(document.getElementById('date-start').value || '1900-01-01');
            const end = new Date(document.getElementById('date-end').value || '2100-12-31');
            const grp = document.getElementById('filter-group').value;
            const iss = document.getElementById('filter-issue').value;
            const mac = document.getElementById('filter-machine').value;
            
            const fWaste = wasteData.filter(r => 
                r.date >= start && r.date <= end && 
                (grp === 'ALL' || r.group === grp) &&
                (iss === 'ALL' || r.issue === iss) &&
                (mac === 'ALL' || r.machine === mac)
            );
            const fCon = conData.filter(r => r.date >= start && r.date <= end);

            const totalWaste = fWaste.reduce((s,r) => s + r.weight, 0);
            const totalCon = fCon.reduce((s,r) => s + r.weight, 0);
            const ncp = totalCon > 0 ? (totalWaste / totalCon) * 100 : 0;

            document.getElementById('total-con').innerText = totalCon.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('total-waste').innerText = totalWaste.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('ncp-percent').innerText = ncp.toFixed(2) + "%";

            document.getElementById('table-waste').innerHTML = fWaste.map(r => `<tr><td>${r.issue}</td><td class="text-right">${r.weight.toFixed(2)}</td></tr>`).join('');
            document.getElementById('table-con').innerHTML = Object.entries(fCon.reduce((a,c)=>{a[c.machine]=(a[c.machine]||0)+c.weight; return a},{})).map(([m,w])=>`<tr><td>${m}</td><td class="text-right">${w.toFixed(2)}</td></tr>`).join('');
        }

        fetchAllData();
    </script>
</body>
</html>
