<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Waste & Consumption Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-8">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Waste & Consumption</h1>
                <p class="text-slate-500">รายงานประสิทธิภาพและการสูญเสียการผลิต</p>
            </div>
            <button onclick="resetFilters()" class="bg-white border border-slate-200 hover:bg-slate-50 px-5 py-2 rounded-lg text-sm font-semibold transition shadow-sm">ล้างตัวกรอง</button>
        </header>
        
        <section class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-wrap gap-6 items-end">
            <div class="flex gap-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-2">จากวันที่</label>
                    <input type="date" id="date-start" class="bg-slate-50 border-none p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500" onchange="updateDashboard()">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider font-bold text-slate-400 mb-2">ถึงวันที่</label>
                    <input type="date" id="date-end" class="bg-slate-50 border-none p-3 rounded-xl w-full focus:ring-2 focus:ring-blue-500" onchange="updateDashboard()">
                </div>
            </div>
            <div class="flex-grow grid grid-cols-2 md:grid-cols-4 gap-4">
                <select id="group-filter" class="bg-slate-50 border-none p-3 rounded-xl text-sm" onchange="updateDashboard()"><option value="all">Department</option></select>
                <select id="col-c-filter" class="bg-slate-50 border-none p-3 rounded-xl text-sm" onchange="updateDashboard()"><option value="all">Description</option></select>
                <select id="machine-filter" class="bg-slate-50 border-none p-3 rounded-xl text-sm" onchange="updateDashboard()"><option value="all">เครื่องจักร (W)</option></select>
                <select id="cons-machine-filter" class="bg-slate-50 border-none p-3 rounded-xl text-sm" onchange="updateDashboard()"><option value="all">เครื่องจักร (C)</option></select>
            </div>
        </section>
        
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-400 uppercase font-bold tracking-widest mb-1">Total Waste</p>
                <p id="total-weight" class="font-bold text-4xl text-slate-900">0.00</p>
                <p class="text-sm text-slate-400 mt-1">กิโลกรัม</p>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-xs text-slate-400 uppercase font-bold tracking-widest mb-1">Total Cons</p>
                <p id="total-con" class="font-bold text-4xl text-slate-900">0.00</p>
                <p class="text-sm text-slate-400 mt-1">กิโลกรัม</p>
            </div>
            <div class="bg-blue-600 p-8 rounded-3xl shadow-lg shadow-blue-200">
                <p id="waste-percent-label" class="text-xs text-blue-100 uppercase font-bold tracking-widest mb-1">Waste %</p>
                <p id="waste-percent" class="font-bold text-4xl text-white">0.00%</p>
                <p id="target-display" class="text-xs text-blue-200 font-medium mt-2"></p>
            </div>
        </section>

        <section class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-8">
                <h2 id="chart-title" class="font-bold text-xl text-slate-900">แนวโน้มการผลิต</h2>
                <div class="flex bg-slate-100 p-1.5 rounded-2xl" id="time-toggle">
                    <button onclick="setTimeGroup('day')" id="btn-day" class="px-5 py-2 text-xs font-bold rounded-xl transition-all">Daily</button>
                    <button onclick="setTimeGroup('week')" id="btn-week" class="px-5 py-2 text-xs font-bold rounded-xl bg-white text-blue-600 shadow-sm">Weekly</button>
                    <button onclick="setTimeGroup('month')" id="btn-month" class="px-5 py-2 text-xs font-bold rounded-xl transition-all">Monthly</button>
                </div>
            </div>
            <canvas id="trendChart" height="80"></canvas>
        </section>
    </div>

    <script>
        Chart.register(ChartDataLabels);
        const sheetWasteUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSujwDMZcl2kxH9Cph6tuv7L3mfOgCPvz9OJcTu1wcKtu6_RB9_gjpc8bxL_TTRXUo4RYz6m_oa732/pub?output=csv';
        let wasteData = [], trendChart, currentTimeGroup = 'week';

        const targets = {
            "BHS": { "เศษติดแกน-ผลิต": 0.15, "รอยต่อออร์เดอร์": 0.20, "Web": 0.15, "Def": 1.10, "NCP": 2.00, "สันนูนตรงสเปค": 0.15, "งานเหลือโอเอ็ม": 0.05, "ของเหลือ": 1.01, "Conveyor": 0.03, "Reject QC": 0.09 },
            "YUELI": { "เศษติดแกน-ผลิต": 0.15, "รอยต่อออร์เดอร์": 0.20, "Web": 0.15, "Def": 1.10, "NCP": 2.00, "สันนูนตรงสเปค": 0.15, "งานเหลือโอเอ็ม": 0.05, "ของเหลือ": 1.01, "Conveyor": 0.03, "Reject QC": 0.09 },
            "ISOWA": { "เศษติดแกน-ผลิต": 0.15, "รอยต่อออร์เดอร์": 0.16, "Web": 0.17, "Def": 1.10, "NCP": 2.40, "สันนูนตรงสเปค": 0.15, "งานเหลือโอเอ็ม": 0.05, "ของเหลือ": 0.66, "Conveyor": 0.00, "Reject QC": 0.09 }
        };

        function setTimeGroup(mode) {
            currentTimeGroup = mode;
            ['day', 'week', 'month'].forEach(m => {
                const btn = document.getElementById('btn-' + m);
                btn.className = (m === mode) ? "px-5 py-2 text-xs font-bold rounded-xl bg-white text-blue-600 shadow-sm" : "px-5 py-2 text-xs font-bold rounded-xl text-slate-500 hover:text-slate-900";
            });
            updateDashboard();
        }

        function parseCleanFloat(val) { return parseFloat(val?.toString().replace(/,/g, '')) || 0; }
        function formatDate(dStr) {
            const parts = dStr.trim().split(/[\/\-]/);
            if (parts.length === 3) {
                let [d, m, y] = parts;
                if (y.length === 2) y = "20" + y;
                return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
            }
            return dStr.trim();
        }

        function getWeekNumber(dateStr) {
            const date = new Date(dateStr);
            const sunday = new Date(date);
            sunday.setDate(date.getDate() - date.getDay());
            const year = sunday.getFullYear();
            const startOfYear = new Date(year, 0, 1);
            const pastDays = (sunday - startOfYear) / 86400000;
            const weekNo = Math.ceil((pastDays + startOfYear.getDay() + 1) / 7);
            return `${year}-W${weekNo.toString().padStart(2, '0')}`;
        }

        async function fetchAllData() {
            const wRes = await fetch(sheetWasteUrl).then(r=>r.text());
            const rows = wRes.split('\n').slice(1);
            wasteData = rows.filter(r => r.trim()).map(row => {
                const c = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(x => x.replace(/^"|"$/g, '').trim());
                return { group: c[0], colC: c[2], machine: c[3], weight: parseCleanFloat(c[4]), date: formatDate(c[5]), cons: parseCleanFloat(c[6]), consType: c[7], consMachine: c[8] };
            });
            const maps = { 'group-filter': 'group', 'col-c-filter': 'colC', 'machine-filter': 'machine', 'cons-machine-filter': 'consMachine' };
            Object.keys(maps).forEach(id => {
                const sel = document.getElementById(id);
                [...new Set(wasteData.map(r => r[maps[id]]))].filter(Boolean).sort().forEach(v => sel.innerHTML += `<option value="${v}">${v}</option>`);
            });
            updateDashboard();
        }

        function updateDashboard() {
            const start = document.getElementById('date-start').value, end = document.getElementById('date-end').value;
            const mFilter = document.getElementById('machine-filter').value, cMFilter = document.getElementById('cons-machine-filter').value;
            const cFilter = document.getElementById('col-c-filter').value, gFilter = document.getElementById('group-filter').value;
            
            const title = (cFilter !== 'all' ? cFilter : 'Waste %');
            document.getElementById('waste-percent-label').innerText = title + ' %';
            document.getElementById('chart-title').innerText = 'แนวโน้ม ' + title;

            const targetVal = (targets[mFilter] && targets[mFilter][cFilter]) ? targets[mFilter][cFilter] : null;
            document.getElementById('target-display').innerText = targetVal ? `Target: ${targetVal.toFixed(2)} %` : '';

            let totalW = 0, totalC = 0;
            const periods = {};

            wasteData.forEach(r => {
                if ((start && r.date < start) || (end && r.date > end)) return;
                let p = r.date;
                if (currentTimeGroup === 'week') p = getWeekNumber(r.date);
                if (currentTimeGroup === 'month') p = r.date.substring(0, 7);
                if (!periods[p]) periods[p] = { w: 0, c: 0 };
                const matchWaste = (mFilter === 'all' || r.machine === mFilter) && (cFilter === 'all' || r.colC === cFilter) && (gFilter === 'all' || r.group === gFilter);
                const matchCons = (cMFilter === 'all' || r.consMachine === cMFilter) && (r.consType && r.consType.includes('Cons'));
                if (matchWaste) { periods[p].w += r.weight; totalW += r.weight; }
                if (matchCons) { periods[p].c += r.cons; totalC += r.cons; }
            });

            document.getElementById('total-weight').innerText = totalW.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('total-con').innerText = totalC.toLocaleString(undefined, {minimumFractionDigits: 2});
            document.getElementById('waste-percent').innerText = (totalC > 0 ? (totalW / totalC * 100).toFixed(2) : 0) + '%';

            const sortedKeys = Object.keys(periods).sort();
            const actuals = sortedKeys.map(k => periods[k].c > 0 ? (periods[k].w / periods[k].c * 100).toFixed(2) : 0);
            const targetsData = targetVal ? sortedKeys.map(() => targetVal.toFixed(2)) : [];

            if(trendChart) trendChart.destroy();
            trendChart = new Chart(document.getElementById('trendChart').getContext('2d'), {
                type: 'line',
                data: { labels: sortedKeys, datasets: [{ label: 'Actual %', data: actuals, borderColor: '#3b82f6', backgroundColor: '#dbeafe', tension: 0.4, fill: true }, { label: 'Target', data: targetsData, borderColor: '#f87171', borderDash: [5, 5], fill: false }] },
                options: { 
                    responsive: true, 
                    plugins: { 
                        datalabels: { 
                            anchor: 'end', 
                            align: 'top', 
                            formatter: (value, context) => context.dataset.label === 'Actual %' ? value + '%' : null,
                            color: '#1e293b',
                            font: { weight: 'bold', size: 10 }
                        } 
                    }, 
                    scales: { y: { beginAtZero: true, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } } 
                }
            });
        }
        function resetFilters() { location.reload(); }
        fetchAllData();
    </script>
</body>
</html>
